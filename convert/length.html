<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Uniton | 길이 변환기</title>
    <meta name="description" content="Uniton 길이 변환기: 모든 길이 단위를 검색 기능으로 빠르고 정확하게 변환합니다.">
    
    <!-- Tailwind CSS CDN 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Pretendard 폰트 로드 (일관성 유지) -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <!-- Google Fonts Material Symbols 아이콘 로드 (Outlined 스타일 사용) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <!-- 표준 CSS 스타일 (일관성 유지) -->
    <style>
        /* 드래그 선택 색상 (검정색 배경, 흰색 텍스트) */
        ::selection {
            background: #1f2937; 
            color: #ffffff;
        }

        /* 기본 설정 */
        body {
            min-height: 100vh;
            background-color: #ffffff; 
            color: #374151;
            font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-x: hidden; 
            padding-top: 5rem;
            padding-bottom: 3rem; 
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* 상단 고정(Fixed) 헤더 스타일 */
        .fixed-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4rem;
            background-color: #ffffff;
            z-index: 1000;
            border-bottom: 1px solid #e5e7eb;
            padding: 0 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: none !important;
        }

        /* Fixed Header 안의 로고 스타일 */
        .fixed-header h1 {
            font-size: 1.5rem; 
            margin: 0;
            line-height: 1;
            flex-grow: 1; 
            text-align: center;
        }

        /* 로고 링크 스타일 초기화 */
        .fixed-header h1 a {
            text-decoration: none;
            color: inherit;
        }

        @media (min-width: 768px) {
            .fixed-header h1 {
                font-size: 2rem;
            }
        }
        
        .unit-bold {
            font-weight: 800;
            color: #1f2937;
        }

        .thin-font {
            font-weight: 300;
            color: #1f2937;
        }

        /* 홈으로 버튼 스타일 */
        .back-button {
            position: absolute;
            left: 1rem;
            display: flex;
            align-items: center;
            color: #4b5563;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            transition: color 0.15s;
        }

        .back-button:hover {
            color: #1f2937;
        }

        .back-button .material-symbols-outlined {
            font-size: 1.5rem;
            margin-right: 0.25rem;
        }
        
        /* 메인 컨테이너 */
        .main-container {
            width: 100%;
            max-width: 48rem; 
            margin: 0 auto;
            padding: 0 1rem;
        }

        /* Input 및 Custom Select 스타일 공통 적용 */
        .converter-input, .unit-picker-input {
            display: block;
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 500;
            color: #1f2937;
            background-color: #ffffff;
            transition: border-color 0.15s, box-shadow 0.15s;
            cursor: pointer; /* 검색 가능한 드롭다운처럼 보이도록 */
        }
        
        .converter-input:focus, .unit-picker-input:focus {
            outline: none;
            border-color: #6b7280;
            box-shadow: 0 0 0 3px rgba(107, 114, 128, 0.1);
        }

        /* 검색 드롭다운 목록 스타일 */
        .unit-option {
            padding: 0.5rem 1rem;
            cursor: pointer;
            transition: background-color 0.1s;
        }

        .unit-option:hover {
            background-color: #f3f4f6;
        }
        
        /* 결과 표시 영역 */
        #result-display {
            padding: 1rem 1.5rem;
            background-color: #ffffff;
            border: 1px solid #e5e7eb; 
            border-radius: 0.75rem;
            text-align: left;
            margin-top: 1.5rem;
            min-height: 5rem;
            box-shadow: none; 
        }

        .result-label {
            font-size: 0.875rem;
            font-weight: 500;
            color: #6b7280;
            margin-bottom: 0.25rem;
        }
        
        .result-value {
            font-size: 1.875rem; /* 3xl */
            font-weight: 700;
            color: #1f2937;
            word-break: break-all;
        }
        
        .result-unit {
            font-size: 1.125rem; /* lg */
            font-weight: 500;
            color: #4b5563;
            margin-left: 0.5rem;
        }
        
        /* 버튼 스타일 */
        .swap-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 3rem;
            height: 3rem;
            background-color: #f3f4f6;
            color: #4b5563;
            border-radius: 9999px; 
            border: 1px solid #d1d5db;
            transition: all 0.15s;
            cursor: pointer;
            flex-shrink: 0;
        }
        
        .swap-button:hover {
            background-color: #e5e7eb;
            color: #1f2937;
        }
        
        .swap-button .material-symbols-outlined {
            font-size: 1.5rem;
        }

        /* 폰트 크기가 작은 단위의 기호 */
        .text-xs-force { font-size: 0.75rem; }
    </style>
</head>
<body>
    
    <!-- Fixed Header (상단 고정 헤더) -->
    <div class="fixed-header">
        <!-- 홈으로 버튼 (뒤로가기 대신 홈 아이콘 및 텍스트 사용) -->
        <a href="index.html" class="back-button" aria-label="메인 페이지로 돌아가기">
            <span class="material-symbols-outlined">home</span>
            홈으로
        </a>
        
        <!-- Uniton 로고 (클릭 가능) -->
        <h1>
            <a href="index.html" style="text-decoration: none; color: inherit;" aria-label="Uniton 홈으로 이동">
                <span class="unit-bold">Unit</span><span class="thin-font">on</span>
            </a>
        </h1>
    </div>

    <!-- 메인 컨테이너 -->
    <div class="main-container">

        <!-- 길이 변환기 (박스 선 삭제 요청 반영) -->
        <div class="p-6 sm:p-8">
            <header class="mb-6">
                <h2 class="text-2xl font-semibold text-gray-800 flex items-center">
                    <span class="material-symbols-outlined mr-2 text-gray-600">straighten</span>
                    길이 변환기
                </h2>
                <p class="text-sm text-gray-500 mt-1">값을 입력하고 단위를 검색하여 선택하세요.</p>
            </header>

            <!-- 입력 섹션 (변환할 값) -->
            <div class="mb-4">
                <label for="from-value" class="block text-sm font-medium text-gray-700 mb-1">변환할 값</label>
                <input type="number" id="from-value" class="converter-input" placeholder="0" value="1" min="0" oninput="convertLength()">
            </div>

            <!-- 단위 선택 및 스왑 버튼 섹션 -->
            <div class="flex items-center space-x-3 mb-6">
                
                <!-- 1. 출발 단위 검색 드롭다운 -->
                <div class="flex-1 relative" id="from-unit-picker">
                    <label class="block text-sm font-medium text-gray-700 mb-1">출발 단위</label>
                    <input type="text" 
                           id="from-unit-input" 
                           class="unit-picker-input" 
                           readonly 
                           onclick="toggleDropdown('from')" 
                           placeholder="단위 검색..."
                           value="인치 (in)">
                    
                    <!-- 실제 선택된 값을 저장할 필드 -->
                    <input type="hidden" id="from-unit-value" value="in">

                    <!-- 드롭다운 리스트 -->
                    <div id="from-unit-dropdown" class="absolute z-20 w-full mt-1 bg-white border border-gray-300 rounded-lg max-h-60 overflow-y-auto hidden">
                        <input type="text" 
                               id="from-search-input" 
                               class="unit-picker-input sticky top-0" 
                               style="border:none; border-bottom: 1px solid #d1d5db; border-radius: 0; padding: 0.75rem 1rem;"
                               oninput="filterUnits('from', this.value)" 
                               placeholder="단위 이름 또는 기호 검색...">
                        <div id="from-unit-list">
                            <!-- JS가 옵션을 여기에 렌더링함 -->
                        </div>
                    </div>
                </div>
                
                <!-- 스왑 버튼 -->
                <div class="flex-shrink-0 pt-6">
                    <button id="swap-button" class="swap-button" aria-label="단위 스왑" onclick="swapUnits()">
                        <span class="material-symbols-outlined">swap_vert</span>
                    </button>
                </div>

                <!-- 2. 도착 단위 검색 드롭다운 -->
                <div class="flex-1 relative" id="to-unit-picker">
                    <label class="block text-sm font-medium text-gray-700 mb-1">도착 단위</label>
                    <input type="text" 
                           id="to-unit-input" 
                           class="unit-picker-input" 
                           readonly 
                           onclick="toggleDropdown('to')" 
                           placeholder="단위 검색..."
                           value="미터 (m)">

                    <!-- 실제 선택된 값을 저장할 필드 -->
                    <input type="hidden" id="to-unit-value" value="m">

                    <!-- 드롭다운 리스트 -->
                    <div id="to-unit-dropdown" class="absolute z-20 w-full mt-1 bg-white border border-gray-300 rounded-lg max-h-60 overflow-y-auto hidden">
                         <input type="text" 
                               id="to-search-input" 
                               class="unit-picker-input sticky top-0" 
                               style="border:none; border-bottom: 1px solid #d1d5db; border-radius: 0; padding: 0.75rem 1rem;"
                               oninput="filterUnits('to', this.value)" 
                               placeholder="단위 이름 또는 기호 검색...">
                        <div id="to-unit-list">
                            <!-- JS가 옵션을 여기에 렌더링함 -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- 결과 표시 섹션 -->
            <div id="result-display">
                <div class="result-label">변환 결과</div>
                <div class="flex items-end">
                    <span id="result-value" class="result-value">0.0254</span>
                    <span id="result-unit" class="result-unit">m</span>
                </div>
            </div>

        </div>

    </div>
    
    <!-- 푸터 -->
    <footer class="w-full max-w-4xl mt-12 px-4">
        <div style="margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid #e5e7eb; text-align: center; font-size: 0.875rem; color: #6b7280; width: 100%;">
            <div class="footer-logo" style="margin-bottom: 0.75rem; font-size: 1.5rem; line-height: 1;">
                 <span class="unit-bold">Unit</span><span class="thin-font">on</span>
            </div>
            <!-- 푸터 링크 수정: 개인정보처리방침을 /privacy로, 문의하기를 /contact로 연결 -->
            <div class="footer-links" style="display: flex; justify-content: center; align-items: center; gap: 0.75rem; font-weight: 500; color: #6b7280;">
                <a href="/privacy" style="color: #6b7280; text-decoration: none; transition: color 0.15s ease-in-out; font-weight: 400;">개인정보처리방침</a> 
                <span style="color: #ccc;">|</span>
                <a href="/contact" style="color: #6b7280; text-decoration: none; transition: color 0.15s ease-in-out; font-weight: 400;">문의하기</a>
            </div>
        </div>
    </footer>
    
    <!-- JavaScript 변환 및 검색 로직 -->
    <script>
        // 전체 길이 단위 목록 (모든 단위는 미터(m)를 기준으로 함)
        const units = [
            // SI 단위
            { value: 'm', name: '미터', symbol: 'm', rate: 1 },
            { value: 'km', name: '킬로미터', symbol: 'km', rate: 1000 },
            { value: 'cm', name: '센티미터', symbol: 'cm', rate: 0.01 },
            { value: 'mm', name: '밀리미터', symbol: 'mm', rate: 0.001 },
            { value: 'um', name: '마이크로미터', symbol: 'μm', rate: 1e-6 },
            { value: 'nm', name: '나노미터', symbol: 'nm', rate: 1e-9 },
            { value: 'A', name: '옹스트롬', symbol: 'Å', rate: 1e-10 },
            // 영/미 관습 단위
            { value: 'mi', name: '마일', symbol: 'mi', rate: 1609.344 },
            { value: 'nmi', name: '해리', symbol: 'nmi', rate: 1852 },
            { value: 'league', name: '리그 (육상)', symbol: 'lea', rate: 4828.032 },
            { value: 'fur', name: '펄롱', symbol: 'fur', rate: 201.168 },
            { value: 'ch', name: '체인', symbol: 'ch', rate: 20.1168 },
            { value: 'rod', name: '로드/폴', symbol: 'rd', rate: 5.0292 },
            { value: 'yd', name: '야드', symbol: 'yd', rate: 0.9144 },
            { value: 'ft', name: '피트', symbol: 'ft', rate: 0.3048 },
            { value: 'in', name: '인치', symbol: 'in', rate: 0.0254 },
            // 천문 단위
            { value: 'au', name: '천문단위', symbol: 'AU', rate: 149597870700 },
            { value: 'ly', name: '광년', symbol: 'ly', rate: 9.4607304725808e15 },
            { value: 'pc', name: '파섹', symbol: 'pc', rate: 3.08567758149137e16 }
        ];

        // 단위 값(value)을 키로 사용하여 빠르게 찾을 수 있는 맵 생성
        const unitMap = units.reduce((acc, unit) => {
            acc[unit.value] = unit;
            return acc;
        }, {});

        /**
         * 검색 가능한 드롭다운을 토글합니다.
         * @param {string} type 'from' 또는 'to'
         */
        function toggleDropdown(type) {
            const dropdown = document.getElementById(`${type}-unit-dropdown`);
            const searchInput = document.getElementById(`${type}-search-input`);

            if (dropdown.classList.contains('hidden')) {
                // 열기 전에 다른 드롭다운 닫기
                if (type === 'from') {
                    document.getElementById('to-unit-dropdown').classList.add('hidden');
                } else {
                    document.getElementById('from-unit-dropdown').classList.add('hidden');
                }

                dropdown.classList.remove('hidden');
                renderUnitList(type, units); // 전체 목록 다시 렌더링
                searchInput.value = ''; // 검색 필드 초기화
                setTimeout(() => searchInput.focus(), 50); // 포커스 이동
            } else {
                // 닫기
                dropdown.classList.add('hidden');
            }
        }

        /**
         * 단위를 필터링하고 목록을 다시 렌더링합니다.
         * @param {string} type 'from' 또는 'to'
         * @param {string} query 사용자가 입력한 검색어
         */
        function filterUnits(type, query) {
            const normalizedQuery = query.toLowerCase().trim();
            const filteredUnits = units.filter(unit => 
                unit.name.toLowerCase().includes(normalizedQuery) || 
                unit.symbol.toLowerCase().includes(normalizedQuery)
            );
            renderUnitList(type, filteredUnits);
        }

        /**
         * 단위 옵션 목록을 렌더링합니다.
         * @param {string} type 'from' 또는 'to'
         * @param {Array<Object>} list 렌더링할 단위 목록
         */
        function renderUnitList(type, list) {
            const listContainer = document.getElementById(`${type}-unit-list`);
            listContainer.innerHTML = ''; // 기존 목록 초기화

            if (list.length === 0) {
                listContainer.innerHTML = `<div class="unit-option text-gray-500">검색 결과가 없습니다.</div>`;
                return;
            }

            list.forEach(unit => {
                const div = document.createElement('div');
                div.className = 'unit-option flex justify-between items-center';
                div.textContent = `${unit.name} (${unit.symbol})`;
                div.dataset.unitValue = unit.value;
                div.onclick = () => selectUnit(type, unit.value);
                listContainer.appendChild(div);
            });
        }

        /**
         * 단위를 선택하고 UI와 히든 값을 업데이트합니다.
         * @param {string} type 'from' 또는 'to'
         * @param {string} unitValue 선택된 단위의 값 ('m', 'km' 등)
         */
        function selectUnit(type, unitValue) {
            const unit = unitMap[unitValue];
            const inputField = document.getElementById(`${type}-unit-input`);
            const hiddenValueField = document.getElementById(`${type}-unit-value`);
            const dropdown = document.getElementById(`${type}-unit-dropdown`);

            inputField.value = `${unit.name} (${unit.symbol})`;
            hiddenValueField.value = unitValue;
            dropdown.classList.add('hidden');
            
            convertLength(); // 단위 변경 후 변환 실행
        }

        /**
         * 출발 단위와 도착 단위를 서로 바꿉니다.
         */
        function swapUnits() {
            const fromValue = document.getElementById('from-unit-value').value;
            const toValue = document.getElementById('to-unit-value').value;
            
            // UI 업데이트
            selectUnit('from', toValue);
            selectUnit('to', fromValue);
            
            // convertLength는 selectUnit 내부에서 이미 호출됨.
        }

        /**
         * 길이를 변환하고 결과를 UI에 표시합니다.
         */
        function convertLength() {
            const fromValueInput = document.getElementById('from-value');
            const fromUnit = document.getElementById('from-unit-value').value;
            const toUnit = document.getElementById('to-unit-value').value;

            const resultValueSpan = document.getElementById('result-value');
            const resultUnitSpan = document.getElementById('result-unit');
            
            const value = parseFloat(fromValueInput.value);

            // 입력 값이 유효하지 않거나 0 미만인 경우 처리
            if (isNaN(value) || value < 0) {
                resultValueSpan.textContent = '유효하지 않은 값';
                resultUnitSpan.textContent = '';
                return;
            }
            
            // 1. 출발 단위를 미터(m)를 기준으로 하는 rate를 가져옵니다.
            const fromRate = unitMap[fromUnit] ? unitMap[fromUnit].rate : 1;
            const toRate = unitMap[toUnit] ? unitMap[toUnit].rate : 1;

            // 2. 변환 로직
            const valueInMeters = value * fromRate;
            const convertedValue = valueInMeters / toRate;

            // 3. 결과 표시 (가독성 개선 로직: 불필요한 0 제거)
            let displayValue;

            if (convertedValue === 0) {
                displayValue = "0";
            } else {
                // toPrecision(12)을 사용하여 최대 12자리의 유효 숫자로 변환합니다.
                let tempValue = convertedValue.toPrecision(12);
                
                // 과학적 표기법이 아닌 경우에만 parseFloat을 사용하여 불필요한 0과 소수점을 제거
                if (!tempValue.includes('e')) {
                    displayValue = parseFloat(tempValue).toString();
                } else {
                     // 과학적 표기법이 포함된 경우, 그대로 사용합니다.
                     displayValue = tempValue.toString();
                }
            }

            resultValueSpan.textContent = displayValue;
            resultUnitSpan.textContent = unitMap[toUnit].symbol;
        }

        // 페이지 로드 후 초기화
        document.addEventListener('DOMContentLoaded', () => {
            // 초기 목록 렌더링 (숨겨져 있더라도 미리 렌더링)
            renderUnitList('from', units);
            renderUnitList('to', units);

            // 초기 값 설정 및 변환 실행
            selectUnit('from', 'in');
            selectUnit('to', 'm');
            // convertLength는 selectUnit 내부에서 이미 호출됨.
            
            // 드롭다운 외부 클릭 시 숨기기 (안정성을 높임)
            document.addEventListener('click', (event) => {
                const fromPicker = document.getElementById('from-unit-picker');
                const toPicker = document.getElementById('to-unit-picker');

                // 클릭된 요소가 'from' picker (인풋, 드롭다운 전체) 내부에 포함되지 않으면 닫기
                if (!fromPicker.contains(event.target)) {
                    document.getElementById('from-unit-dropdown').classList.add('hidden');
                }
                // 클릭된 요소가 'to' picker (인풋, 드롭다운 전체) 내부에 포함되지 않으면 닫기
                if (!toPicker.contains(event.target)) {
                    document.getElementById('to-unit-dropdown').classList.add('hidden');
                }
            });
        });
    </script>

</body>
</html>
