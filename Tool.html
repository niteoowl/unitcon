    <script>
        // --- Localization (i18n) Data ---
        const i18n = {
            'ko': {
                'title': '길이 변환기',
                'page_title': '길이 변환기 - 글로벌 단위 툴',
                'input_label': '변환할 값',
                'output_label': '변환될 값',
                'search_placeholder': '단위 검색 (이름 또는 기호)',
                'swap_title': '단위 교환',
                'formula_title': '변환 공식',
                'formula_toggle_hide': '공식 숨기기',
                'formula_toggle_show': '공식 표시',
                'unit_rate_title': '단위 변환 비율', 
                'units': {
                    'm': '미터', 'km': '킬로미터', 'cm': '센티미터', 'mm': '밀리미터', 'µm': '마이크로미터', 'nm': '나노미터', 'pm': '피코미터',
                    'mi': '마일', 'yd': '야드', 'ft': '피트', 'in': '인치', 'furlong': '펄롱', 'chain': '체인',
                    'li': '리 (里)', 'cheok': '척 (尺)',
                    'nmi': '해리', 'ly': '광년', 'pc': '파섹', 'au': '천문단위', 'A': '옹스트롬', 'cubit': '큐빗'
                }
            },
            'en': {
                'title': 'Length Converter',
                'page_title': 'Length Converter - Global Unit Tool',
                'input_label': 'Input Value',
                'output_label': 'Converted Value',
                'search_placeholder': 'Search Unit (Name or Symbol)',
                'swap_title': 'Swap Units',
                'formula_title': 'Conversion Formula',
                'formula_toggle_hide': 'Hide Formula',
                'formula_toggle_show': 'Show Formula',
                'unit_rate_title': 'Unit Conversion Rate', 
                'units': {
                    'm': 'Meter', 'km': 'Kilometer', 'cm': 'Centimeter', 'mm': 'Millimeter', 'µm': 'Micrometer', 'nm': 'Nanometer', 'pm': 'Picometer',
                    'mi': 'Mile', 'yd': 'Yard', 'ft': 'Foot', 'in': 'Inch', 'furlong': 'Furlong', 'chain': 'Chain',
                    'li': 'Ri (里)', 'cheok': 'Cheok (尺)',
                    'nmi': 'Nautical Mile', 'ly': 'Light-Year', 'pc': 'Parsec', 'au': 'Astronomical Unit', 'A': 'Angstrom', 'cubit': 'Cubit'
                }
            }
        };

        // --- Core Unit Conversion Factors (based on Meter) ---
        const UNIT_CONVERSIONS = {
            'm': { factor: 1 }, 'km': { factor: 1000 }, 'cm': { factor: 0.01 }, 'mm': { factor: 0.001 },
            'µm': { factor: 1e-6 }, 'nm': { factor: 1e-9 }, 'pm': { factor: 1e-12 },
            'mi': { factor: 1609.344 }, 'yd': { factor: 0.9144 }, 'ft': { factor: 0.3048 }, 'in': { factor: 0.0254 },
            'furlong': { factor: 201.168 }, 'chain': { factor: 20.1168 },
            'li': { factor: 392.727 }, 'cheok': { factor: 0.30303 },
            'nmi': { factor: 1852 }, 'ly': { factor: 9.4607304725808e+15 }, 
            'pc': { factor: 3.08567758149e+16 }, 
            'au': { factor: 1.495978707e+11 }, 'A': { factor: 1e-10 }, 'cubit': { factor: 0.4572 },
        };

        // --- Global State ---
        let currentLang = 'en'; // Default to English
        const SUPPORTED_LANGS = Object.keys(i18n);
        let isFormulaVisible = true; // State for formula toggle

        // --- DOM Element References ---
        const htmlElement = document.documentElement;
        const inputDisplay = document.getElementById('input-unit-display');
        const outputDisplay = document.getElementById('output-unit-display');
        const inputHidden = document.getElementById('input-unit');
        const outputHidden = document.getElementById('output-unit');
        const inputList = document.getElementById('input-unit-list');
        const outputList = document.getElementById('output-unit-list');
        const inputValue = document.getElementById('input-value');
        const outputValue = document.getElementById('output-value');
        const formulaDisplay = document.getElementById('formula-display');
        const formulaToggleButton = document.getElementById('toggle-formula-btn');
        const rateTitle = document.getElementById('rate-title'); 
        const conversionRateText = document.getElementById('conversion-rate-text'); 


        /**
         * Determines the language based on the browser setting.
         * @returns {string} The determined language code ('en' or 'ko').
         */
        function getLanguage() {
            const browserLang = navigator.language.split('-')[0].toLowerCase();
            if (SUPPORTED_LANGS.includes(browserLang)) {
                return browserLang;
            }
            return 'en'; // Default
        }

        /**
         * Translates UI elements based on the current language.
         */
        function translateUI() {
            const translations = i18n[currentLang];
            
            // HTML lang attribute
            htmlElement.setAttribute('lang', currentLang);
            
            // Header and Title
            document.getElementById('page-title').textContent = translations.page_title;
            document.getElementById('app-title').textContent = translations.title;

            // Labels
            document.getElementById('label-input-value').textContent = translations.input_label;
            document.getElementById('label-output-value').textContent = translations.output_label;

            // Placeholders and Titles
            const placeholderText = translations.search_placeholder;
            inputDisplay.placeholder = placeholderText;
            outputDisplay.placeholder = placeholderText;
            document.getElementById('swap-button').title = translations.swap_title;
            
            // Formula Title and Toggle Button
            document.getElementById('formula-title').textContent = translations.formula_title;
            rateTitle.textContent = translations.unit_rate_title; 
            
            formulaToggleButton.textContent = isFormulaVisible 
                ? translations.formula_toggle_hide
                : translations.formula_toggle_show;


            // Repopulate units with new language names
            populateUnits();
            
            // Re-run conversion to update the formula display content and rate in the new language
            convert();
        }

        /**
         * Generates the HTML for a unit option using the current language.
         * @param {string} key - Unit symbol key (e.g., 'km').
         * @returns {string} HTML string for the unit option.
         */
        function generateUnitOptionHTML(key) {
            const unitName = i18n[currentLang].units[key];
            return `<div class="unit-option" data-unit-key="${key}">
                        ${unitName} <span class="unit-symbol">(${key})</span>
                    </div>`;
        }

        /**
         * Populates the unit selector lists and sets initial display values.
         */
        function populateUnits() {
            // Get all unit keys
            const unitKeys = Object.keys(UNIT_CONVERSIONS);

            // Generate HTML for all units
            const unitsHtml = unitKeys.map(key => generateUnitOptionHTML(key)).join('');

            inputList.innerHTML = unitsHtml;
            outputList.innerHTML = unitsHtml;

            // Update initial display names after language change
            setUnit('input', inputHidden.value);
            setUnit('output', outputHidden.value);
        }

        /**
         * Sets the unit for the specified type (input/output) and updates the UI.
         * @param {string} type - 'input' or 'output'
         * @param {string} key - Unit symbol key (e.g., 'km').
         */
        function setUnit(type, key) {
            const unitName = i18n[currentLang].units[key];
            if (!unitName) return;

            const displayElement = type === 'input' ? inputDisplay : outputDisplay;
            const hiddenElement = type === 'input' ? inputHidden : outputHidden;
            const listElement = type === 'input' ? inputList : outputList;

            // 1. Update the display and hidden input
            displayElement.value = unitName + ' (' + key + ')';
            hiddenElement.value = key;
            
            // 2. Perform conversion first
            convert();

            // 3. Hide the list (Crucial for closing the dropdown)
            listElement.classList.remove('visible');
        }

        /**
         * Opens the unit selector list and clears the search box.
         * @param {string} type - 'input' or 'output'
         */
        function openUnitSelector(type) {
            const listElement = type === 'input' ? inputList : outputList;
            const otherListElement = type === 'input' ? outputList : inputList;

            filterUnits(type, ''); // Show all units
            
            listElement.classList.add('visible');
            otherListElement.classList.remove('visible');

            // Clear display text to enable immediate search
            const displayElement = type === 'input' ? inputDisplay : outputDisplay;
            // Select the existing text to make it easy for the user to delete/type
            setTimeout(() => {
                displayElement.select();
            }, 0); 
        }

        /**
         * Filters the unit list based on the search query.
         * @param {string} type - 'input' or 'output'
         * @param {string} query - Search query.
         */
        function filterUnits(type, query) {
            const listElement = type === 'input' ? inputList : outputList;
            const options = listElement.querySelectorAll('.unit-option');
            const lowerCaseQuery = query.toLowerCase().trim();

            options.forEach(option => {
                // Search against translated name and symbol
                const text = option.textContent.toLowerCase();
                if (text.includes(lowerCaseQuery)) {
                    option.style.display = '';
                } else {
                    option.style.display = 'none';
                }
            });
            listElement.classList.add('visible');
        }

        /**
         * Handles the click on a unit option.
         * @param {Event} event 
         */
        function handleUnitOptionClick(event) {
            let target = event.target;
            
            // Find the parent unit-option element
            while (target && !target.classList.contains('unit-option')) {
                target = target.parentElement;
            }

            if (!target) return;
            
            const key = target.dataset.unitKey;
            let type = null;

            if (target.closest('#input-unit-list')) {
                type = 'input';
            } else if (target.closest('#output-unit-list')) {
                type = 'output';
            }

            if (type && key) {
                // 1. Stop the event from bubbling up to the document's general click-outside handler
                event.stopPropagation();
                
                // 2. Set the unit, which also calls convert() and closes the list
                setUnit(type, key);
                
                // 3. Restore the focus to the main input field for convenience
                inputValue.focus();
            }
        }
        
        /**
         * Swaps the input and output units.
         */
        function swapUnits() {
            const inputKey = inputHidden.value;
            const outputKey = outputHidden.value;

            setUnit('input', outputKey);
            setUnit('output', inputKey);

            convert();
        }

        /**
         * Generates the conversion formula string using LaTeX notation. (Simplified to one clear formula)
         * @param {string} fromKey - Source unit key.
         * @param {string} toKey - Target unit key.
         * @returns {string} LaTeX-formatted formula string.
         */
        function generateFormula(fromKey, toKey) {
            const formulaText = `$$ \\text{Value}_{\\text{${toKey}}} = \\text{Value}_{\\text{${fromKey}}} \\times \\left( \\frac{\\text{Base Factor}_{\\text{${fromKey}}}}{\\text{Base Factor}_{\\text{${toKey}}}} \\right) $$`;
            
            // Force MathJax to re-render
            if (window.MathJax) {
                formulaDisplay.innerHTML = formulaText;
                if (MathJax.startup && MathJax.startup.promise) {
                    MathJax.startup.promise.then(() => {
                        MathJax.typeset([formulaDisplay]);
                    }).catch(err => console.error("MathJax startup error:", err));
                } else {
                    MathJax.typeset([formulaDisplay]);
                }
            } else {
                 // Fallback for non-MathJax environment
                formulaDisplay.innerHTML = `<p>Output Value = Input Value * (Factor in Meters for ${fromKey} / Factor in Meters for ${toKey})</p>`;
            }
        }

        /**
         * Converts the length unit and displays the result and the 1-unit rate.
         */
        function convert() {
            const inputVal = parseFloat(inputValue.value);
            const fromUnitKey = inputHidden.value;
            const toUnitKey = outputHidden.value;

            // Input validation
            if (isNaN(inputVal) || inputVal < 0) {
                outputValue.value = '0.0000';
                formulaDisplay.innerHTML = '$$ \\text{Enter a valid input value.} $$';
                conversionRateText.textContent = `1 ${fromUnitKey} = 0 ${toUnitKey}`;
                return;
            }

            const fromFactor = UNIT_CONVERSIONS[fromUnitKey].factor;
            const toFactor = UNIT_CONVERSIONS[toUnitKey].factor;

            // Conversion logic: Value * (Factor_From / Factor_To)
            const conversionRate = fromFactor / toFactor;
            const outputResult = inputVal * conversionRate;

            // --- 1. Display Result ---
            if (outputResult === 0) {
                outputValue.value = '0';
            } else if (Math.abs(outputResult) >= 1e12 || Math.abs(outputResult) <= 1e-12) {
                // Very large or very small numbers
                outputValue.value = outputResult.toExponential(6);
            } else if (Math.abs(outputResult) >= 1e6 || Math.abs(outputResult) < 1e-4) {
                // Mid-range large/small numbers
                outputValue.value = outputResult.toExponential(4);
            } else {
                // General numbers
                outputValue.value = outputResult.toFixed(4);
            }

            // --- 2. Update 1-Unit Conversion Rate ---
            let formattedRate;
            
            if (conversionRate === 1) {
                formattedRate = '1';
            } else if (Math.abs(conversionRate) >= 1e12 || Math.abs(conversionRate) <= 1e-12) {
                formattedRate = conversionRate.toExponential(10); 
            } else if (Math.abs(conversionRate) >= 1e6 || Math.abs(conversionRate) < 1e-4) {
                formattedRate = conversionRate.toExponential(8); 
            } else {
                // Use maximum possible fixed precision for the rate display and clean trailing zeros
                formattedRate = conversionRate.toFixed(10).replace(/(\.0+|0+)$/, ''); 
                if (formattedRate.endsWith('.')) formattedRate = formattedRate.slice(0, -1);
            }

            conversionRateText.textContent = `1 ${fromUnitKey} = ${formattedRate} ${toUnitKey}`;


            // --- 3. Update formula display ---
            if (isFormulaVisible) {
                generateFormula(fromUnitKey, toUnitKey);
            } else {
                formulaDisplay.innerHTML = '';
            }
        }
        
        /**
         * Toggles the visibility of the formula display.
         */
        function toggleFormulaDisplay() {
            isFormulaVisible = !isFormulaVisible;
            
            const translations = i18n[currentLang];
            
            if (isFormulaVisible) {
                formulaDisplay.style.display = 'block';
                formulaToggleButton.textContent = translations.formula_toggle_hide;
                convert(); // Update and show formula content
            } else {
                formulaDisplay.style.display = 'none';
                formulaToggleButton.textContent = translations.formula_toggle_show;
            }
        }


        // --- Initialization on Page Load ---
        window.onload = function() {
            // 1. Set the initial language
            currentLang = getLanguage();
            
            // 2. Translate UI elements
            translateUI();
            
            // 3. Set up event listeners for unit selection
            inputList.addEventListener('click', handleUnitOptionClick);
            outputList.addEventListener('click', handleUnitOptionClick);

            
            // Close unit list when clicking outside the unit select container
            document.addEventListener('click', function(e) {
                const isClickInsideUnitSelector = e.target.closest('.unit-select-container');
                const isSwapButton = e.target.closest('#swap-button');
                
                // If the click is NOT inside a unit selector OR the swap button area
                if (!isClickInsideUnitSelector && !isSwapButton) {
                    setUnit('input', inputHidden.value);
                    setUnit('output', outputHidden.value);
                }
            });

            // Prevent onfocus from immediately triggering if the user is just clicking inside to search
            inputDisplay.addEventListener('click', function(e) { e.stopPropagation(); });
            outputDisplay.addEventListener('click', function(e) { e.stopPropagation(); });
        };

    </script>
</body>
</html>
